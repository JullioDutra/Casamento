<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel dos Noivos — Entrar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .font-cormorant { font-family: 'Cormorant Garamond', serif; }
  </style>
</head>
<body class="min-h-screen bg-stone-50 flex items-center justify-center px-4">
  <div class="max-w-sm w-full bg-white rounded-xl shadow-lg border border-stone-100 p-8 md:p-10">
    <div class="text-center mb-8">
      <span class="font-cormorant text-4xl text-[#8A1538] block">Painel dos Noivos</span>
      <p class="text-stone-400 text-xs mt-2 uppercase tracking-[0.2em]">Acesso restrito</p>
    </div>

    {% if form.errors %}
      <p class="bg-red-50 text-red-600 text-sm text-center rounded py-2 mb-5">
        Usuário ou senha inválidos. Tente novamente.
      </p>
    {% endif %}

    <form method="post" class="space-y-5">
      {% csrf_token %}
      <div>
        <label class="block text-xs uppercase tracking-widest text-stone-400 mb-1">Usuário</label>
        <input type="text" name="username" class="w-full border-b border-stone-300 focus:border-[#8A1538] outline-none py-2 text-stone-700" required autofocus>
      </div>
      <div>
        <label class="block text-xs uppercase tracking-widest text-stone-400 mb-1">Senha</label>
        <input type="password" name="password" class="w-full border-b border-stone-300 focus:border-[#8A1538] outline-none py-2 text-stone-700" required>
      </div>
      <button type="submit" class="w-full py-3 bg-[#8A1538] text-white text-sm uppercase tracking-[0.15em] rounded-sm hover:bg-[#71102d] transition-colors">
        Entrar
      </button>
    </form>

    <p class="text-center text-stone-400 text-xs mt-6">
      Acesso exclusivo dos noivos — a conta é criada pelo administrador do site.
    </p>
  </div>
</body>
</html>
